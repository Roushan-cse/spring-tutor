[project]
name = "ragbased"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Roushan Kumar", email = "rockygammer95@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "gitpython>=3.1.62",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.5",
    "langchain-huggingface>=1.2.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.6",
    "langchain-postgres>=0.0.18",
    "langgraph>=1.2.12",
    "langsmith>=0.14.1",
    "pgvector>=0.3.6",
    "pinecone>=10.0.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.1",
    "tiktoken>=0.14.0",
    "unstructured>=0.27.9",
    "uvicorn>=0.54.0",
]

[project.scripts]
ragbased = "ragbased:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
